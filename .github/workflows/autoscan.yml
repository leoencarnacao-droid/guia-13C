name: ZAP Security Scan
on:
  push:
    branches: [ main, develop ]

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan the web application
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Levantar la App con Docker Compose
        run: |
          docker compose up -d --build
          echo "Esperando a que la Notes App levante..."
          for i in {1..30}; do
            if curl -s http://localhost:8080 > /dev/null; then
              echo "¡App lista para escanear!"
              exit 0
            fi
            echo "Esperando... ($i/30)"
            sleep 2
          done
          exit 1

      - name: ZAP Scan (Automation Framework)
        run: |
          mkdir -p reports
          chmod -R 777 reports
          # Usamos -P 8090 para el proxy y el plan que apunta a localhost:8080
          docker run --rm --network host -v $(pwd)/reports:/zap/wrk/reports:rw -v $(pwd):/zap/wrk/:rw \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -cmd -autorun /zap/wrk/.zap/zap-plan-k8s.yml -P 8090

      - name: Subir Reporte de Vulnerabilidades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-report
          path: reports/
