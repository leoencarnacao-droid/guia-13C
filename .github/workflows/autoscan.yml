name: ZAP Security Scan
on:
  push:
    branches: [ main, develop ]

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan the web application
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # En el Sprint 3 pide levantar la app. Como estamos en GitHub, 
      # usamos Docker Compose (igual que en el 13B) para levantarla.
      - name: Levantar la App con Docker Compose
        run: |
          docker compose up -d
          # Esperamos a que la app responda
          for i in {1..30}; do
            if curl -s http://localhost:8080 > /dev/null; then
              echo "¡App lista!"
              exit 0
            fi
            sleep 2
          done
          exit 1

      # Sprint 4: Job de Seguridad en GitHub Actions (Comando exacto del TP)
      - name: ZAP Scan
        run: |
          mkdir -p reports
          chmod -R 777 reports
          docker run -v $(pwd):/zap/wrk/:rw -t zaproxy/zap-stable zap.sh -cmd -autorun /zap/wrk/zap.yaml -P 8090

      - name: Subir Reporte de Vulnerabilidades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-report
          path: reports/
