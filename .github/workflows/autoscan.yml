name: ZAP Security Scan
on:
  push:
    branches: [ main, develop ]

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan the web application
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Levantar la App con Docker Compose
        run: |
          docker compose up -d --build
          echo "Esperando a que la Notes App levante..."
          for i in {1..30}; do
            if curl -s http://localhost:8080 > /dev/null; then
              echo "¡App lista para escanear!"
              exit 0
            fi
            echo "Esperando... ($i/30)"
            sleep 2
          done
          exit 1

      # Usamos la acción oficial del TP13B/13C
      - name: ZAP Scan (Automation Framework)
        uses: zaproxy/action-af@v0.3.0
        with:
          plan: '.zap/zap-plan-k8s.yml'
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'

      - name: Subir Reporte de Vulnerabilidades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-report
          path: reports/
          retention-days: 7
